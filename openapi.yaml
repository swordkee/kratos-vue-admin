                    $ref: '#/components/schemas/api.admin.v1.AuthReply_Role'
                permissions:
                    type: array
                    items:
                        type: string
                menus:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.admin.v1.MenuTreeAuth'
        api.admin.v1.AuthReply_Role:
            type: object
            properties:
                roleId:
                    type: string
                roleName:
                    type: string
                status:
                    type: integer
                    format: int32
                roleKey:
                    type: string
                roleSort:
                    type: integer
                    format: int32
                dataScope:
                    type: integer
                    format: int32
                createBy:
                    type: string
                updateBy:
