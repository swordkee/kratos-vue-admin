tags:
    - name: Api
      description: api管理
    - name: AttachmentCategoryService
      description: |-
        媒体库（附件/上传）域 —— 迁移自 api-admin（gin-vue-admin）server/api/v1/example：
           exa_attachment_category.go       分类树（/attachmentCategory/*）
           exa_file_upload_download.go      文件记录（/fileUploadAndDownload/*）
           exa_breakpoint_continue.go       断点续传（/fileUploadAndDownload/{findFile,breakpointContinue*}）

         路径与源端逐条对齐（源前端 web/src/api/{attachmentCategory,breakpoint,fileUploadAndDownload}.js 直连）。

         ⚠️ 不进 proto 的 3 条 multipart/流式路由（挂在 server/http.go，operation 见各 handler）：
           POST /fileUploadAndDownload/upload             普通上传（form 字段 file；query noSave=1 只回显不落库）
           POST /fileUploadAndDownload/breakpointContinue 分片上传（form: file/fileMd5/fileName/chunkNumber/chunkTotal/chunkMd5）
             其中 fileMd5 为「文件指纹」（源端是整体 MD5；本仓前端用 sha256(文件名|大小|最后修改时间)，
             服务端只把它当会话键，不做格式校验）；chunkMd5 支持两种形态：裸 32 位十六进制=MD5（源口径），
             "sha256:<hex>"=SHA-256（浏览器 WebCrypto 无 MD5）。
           GET  /fileUploadAndDownload/download           下载（?id= 或 ?key=；本地存储流式回包，aliyun 302 到直链）

         源端已确认**存在**断点续传/扫码上传：
           - 断点续传：源 view/example/breakpoint/breakpoint.vue（1MB 分片 + SparkMD5 + 秒传/续传/合并/清片），
             本次完整移植（分片暂存本地、合并后落存储并建档）；
           - 扫码上传：源 view/example/upload/scanUpload.vue 为手机页，复用的就是 /upload（token 走 query），
             无独立后端端点 ⇒ 本次只补前端页 + 静态路由，不新增公开接口。

         未迁移（显式登记，源端依赖壁纸 AI/阿里云缩略图专用逻辑）：
           /fileUploadAndDownload/uploadbyai     AI 自动打标（依赖 wallpaper.GetMetadata + 翻译 + w_menu_category/w_tags）
           /fileUploadAndDownload/uploadPublic   公开读上传（源端仅本地/公开桶的一层包装，与 upload 同构）
           /fileUploadAndDownload/clearThumbnail 按 key 推导 7 个 webp 缩略图键再删（壁纸派生图专用，走 OSS SDK 私有语义）
    - name: BreakpointContinueService
    - name: Dept
      description: 部门管理
    - name: DictData
    - name: DictType
    - name: FileUploadAndDownloadService
    - name: LogsService
    - name: Menus
      description: 菜单管理
    - name: MessageService
      description: |-
        统一站内信（KVA 域，表 sys_message；TASK-03 批1 模板版，2026-09-23）

         身份纪律（服务端强制，请求里的 uid 不可信）：
           - List/Get/已读/删除/未读数的目标收件人一律取 JWT claims 的 UserID（authz.FromContext）；
           - ListMessages 额外允许「超管传 uid 查他人」，非超管传他人 uid → 403，无身份 → 401；
           - SendMessage 的 uid=收件人（可为任意用户），sender_id/sender_name 由服务端 claims 注入；
           - MarkRead / DeleteMessage 请求体不带 uid（带了也会被忽略）。
    - name: Roles
      description: 角色管理
    - name: SysMfa
      description: |-
        MFA TOTP 双因素认证
         R26 接入（设计 docs/design/2026-09-12-mfa-totp-integration.md，参考 api-admin feature/mfa-totp）：
           - 两段式登录：密码 → MfaPending 5min token → Verify 校验动态码/恢复码 → 正式 token
           - 绑定/解绑/恢复码/管理员重置；默认不启用（auth.mfa.enabled=false）
    - name: SysPost
      description: 岗位管理
    - name: SysSecurityConfig
      description: |-
        SysSecurityConfig 登录安全策略（gva model/system/sys_security_config.go +
         service/system/sys_security_config.go + service/system/security_lock.go 回灌）。

         存储：单行表 sys_security_config（固定 id=1，DDL 见
         deploy/sql/20261105_sys_security_config.sql）；进程内原子缓存热读，保存即热更新。

         行为接入：登录失败锁定段（lockEnable/lockThreshold/lockDuration）已接入
         POST /system/user/login（失败计数、达阈值置锁、成功清计数、锁定期直接拒绝）；
         计数/锁态存 Redis（未配置 Redis 时进程内存，对齐 gva GVA_CACHE 双后端语义），
         Redis 故障时按源语义「不计数、不锁定」并记日志。
         其余段（验证码/密码复杂度/限流/密码过期/MFA 强制）先按源落库并提供读写面，
         行为接入情况见 docs/tasks 台账登记项。
    - name: SysUser
      description: 用户管理
